<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eastend - Getränkekarte</title>
    <style>
        /* Base styles - Strict Black and White */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Printable Card Sheet */
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            border: 2px solid #000000;
            padding: 40px;
            margin: auto;
        }

        /* Header */
        header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #000000;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* Menu Content Area */
        #menu-container {
            width: 100%;
        }

        .menu-section {
            margin-top: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #000000;
        }

        .menu-section:last-of-type {
            border-bottom: 2px solid #000000;
        }

        h2 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .item-row:last-child {
            margin-bottom: 0;
        }

        .item-details {
            display: flex;
            flex-direction: column;
        }

        .item-name {
            font-size: 15px;
            font-weight: 600;
        }

        .item-sub {
            font-size: 12px;
            font-weight: 400;
            margin-top: 2px;
        }

        /* Prices: Thin & Cursive */
        .item-price {
            font-size: 15px;
            font-weight: 300;
            font-style: italic;
            white-space: nowrap;
            margin-left: 16px;
        }

        .section-desc {
            font-size: 12px;
            margin-bottom: 12px;
        }

        /* Footer & QR Code Area */
        footer {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        /* Footer Text: Thin & Cursive */
        .footer-text {
            font-size: 12px;
            font-weight: 300;
            font-style: italic;
            line-height: 1.5;
        }

        .qr-box {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-shrink: 0;
        }

        /* QR code is only shown in the screenshot (?shot) version */
        body.shot .qr-box {
            display: flex;
        }

        .qr-code {
            width: 108px;
            height: 108px;
        }

        .qr-label {
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
            max-width: 130px;
            line-height: 1.4;
        }

        /* Error state formatting */
        .error-message {
            font-size: 14px;
            padding: 20px 0;
            text-align: center;
            font-style: italic;
        }

        /* Full-bleed mode for automated screenshots (?shot): no frame,
           card fills the entire viewport */
        body.shot {
            padding: 0;
            display: block;
        }

        body.shot .card {
            width: 100%;
            max-width: none;
            min-height: 100vh;
            border: none;
            margin: 0;
        }

        /* Print Optimization */
        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm;
            }

            body {
                padding: 0;
                background: #ffffff;
            }

            .card {
                max-width: 100%;
                border: 2px solid #000000;
                padding: 30px;
                page-break-inside: avoid;
            }
        }
    </style>
</head>

    <!-- FETCHING DATA FROM menu.json -->
    <script>
        // ?shot => full-bleed layout for automated screenshots
        if (location.search.includes('shot')) {
            document.body.classList.add('shot');
            // report the card's height for the screenshot script
            new ResizeObserver(() => {
                document.title = 'SHOTHEIGHT=' +
                    Math.ceil(document.querySelector('.card').getBoundingClientRect().height);
            }).observe(document.querySelector('.card'));
        }

        // Render menu content dynamically into DOM
        function renderMenu(data) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            data.forEach(section => {
                const sectionEl = document.createElement('section');
                sectionEl.className = 'menu-section';

                let sectionHTML = `<h2>${section.category}</h2>`;

                if (section.description) {
                    sectionHTML += `<div class="section-desc">${section.description}</div>`;
                }

                section.items.forEach(item => {
                    sectionHTML += `
                        <div class="item-row">
                            <div class="item-details">
                                <span class="item-name">${item.name}</span>
                                ${item.sub ? `<span class="item-sub">${item.sub}</span>` : ''}
                            </div>
                            <span class="item-price">${item.price}</span>
                        </div>
                    `;
                });

                sectionEl.innerHTML = sectionHTML;
                container.appendChild(sectionEl);
            });
        }

        // Fetch menu.json asynchronously
        async function loadMenu() {
            try {
                const response = await fetch('menu.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                renderMenu(data);
            } catch (error) {
                console.error('Failed to load menu.json:', error);
                document.getElementById('menu-container').innerHTML = `
                    <div class="error-message">
                        Getränkekarte konnte nicht geladen werden. Bitte prüfen Sie, ob "menu.json" im selben Ordner liegt.
                    </div>
                `;
            }
        }

        // Initialize fetching on page load
        document.addEventListener('DOMContentLoaded', loadMenu);
    </script>
