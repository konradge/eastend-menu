<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eastend - Getränkekarte (Querformat)</title>
    <style>
        /* Base styles - Strict Black and White, A4 landscape */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #eeeeee;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Printable Card Sheet: A4 landscape ratio */
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 297 / 210;
            border: 2px solid #000000;
            padding: 34px 44px;
            margin: auto;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 2px solid #000000;
        }

        h1 {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* Menu Content: 2x2 grid of sections */
        #menu-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto auto;
            align-content: center;
            row-gap: 40px;
            column-gap: 48px;
            padding: 24px 0;
        }

        .menu-section {
            padding-bottom: 14px;
        }

        /* Longdrinks spans the whole bottom row, separated by a thin rule */
        #menu-container .menu-section:last-of-type {
            grid-column: 1 / -1;
            border-top: 1px solid #000000;
            padding-top: 14px;
        }

        h2 {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .item-row:last-child {
            margin-bottom: 0;
        }

        .item-details {
            display: flex;
            flex-direction: column;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
        }

        .item-sub {
            font-size: 11px;
            font-weight: 400;
            margin-top: 2px;
        }

        /* Prices: Thin & Cursive */
        .item-price {
            font-size: 14px;
            font-weight: 300;
            font-style: italic;
            white-space: nowrap;
            margin-left: 16px;
        }

        .section-desc {
            font-size: 11px;
            margin-bottom: 10px;
        }

        /* Footer & QR Code Area: bold rule at the very bottom */
        footer {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 2px solid #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        /* Footer Text: Thin & Cursive */
        .footer-text {
            font-size: 12px;
            font-weight: 300;
            font-style: italic;
            line-height: 1.5;
        }

        .qr-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-shrink: 0;
        }

        .qr-code {
            width: 108px;
            height: 108px;
        }

        .qr-label {
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* Error state formatting */
        .error-message {
            font-size: 14px;
            padding: 20px 0;
            text-align: center;
            font-style: italic;
        }

        /* Print Optimization: exact A4 landscape */
        @media print {
            @page {
                size: A4 landscape;
                margin: 10mm;
            }

            body {
                padding: 0;
                background: #ffffff;
            }

            .card {
                max-width: none;
                width: auto;
                aspect-ratio: auto;
                border: 2px solid #000000;
                padding: 24px 36px;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- HEADER -->
        <header>
            <div>
                <h1>eastend</h1>
                <div class="subtitle">GETRÄNKEKARTE</div>
            </div>
        </header>

        <!-- DYNAMIC MENU SECTIONS (Populated via fetch from ../menu.json) -->
        <main id="menu-container"></main>

        <!-- FOOTER & QR CODE -->
        <footer>
            <div class="footer-text">
                Nur Barzahlung &middot; Bitte Flaschen und Gläser zurückbringen &middot; Keine Getränke mehr ab 0:45
            </div>

            <div class="qr-box">
                <svg class="qr-code" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 37 37" role="img" aria-label="QR-Code: https://konradge.github.io/eastend-menu/"></svg>
                <span class="qr-label">SCAN ME FOR ONLINE MENU</span>
            </div>
        </footer>
    </div>

    <!-- FETCHING DATA FROM menu.json (one level up from /horizontal/) -->
    <script>
        // Render menu content dynamically into DOM
        function renderMenu(data) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            data.forEach(section => {
                const sectionEl = document.createElement('section');
                sectionEl.className = 'menu-section';

                let sectionHTML = `<h2>${section.category}</h2>`;

                if (section.description) {
                    sectionHTML += `<div class="section-desc">${section.description}</div>`;
                }

                section.items.forEach(item => {
                    sectionHTML += `
                        <div class="item-row">
                            <div class="item-details">
                                <span class="item-name">${item.name}</span>
                                ${item.sub ? `<span class="item-sub">${item.sub}</span>` : ''}
                            </div>
                            <span class="item-price">${item.price}</span>
                        </div>
                    `;
                });

                sectionEl.innerHTML = sectionHTML;
                container.appendChild(sectionEl);
            });
        }

        // Fill the QR code SVG from the shared asset
        async function loadQrCode() {
            const svg = document.querySelector('.qr-code');
            const response = await fetch('../qrcode.svg');
            const text = await response.text();
            const inner = text.match(/<svg[^>]*>([\s\S]*)<\/svg>/)[1];
            svg.innerHTML = inner;
        }

        // Fetch menu.json asynchronously
        async function loadMenu() {
            try {
                const response = await fetch('../menu.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                renderMenu(data);
            } catch (error) {
                console.error('Failed to load menu.json:', error);
                document.getElementById('menu-container').innerHTML = `
                    <div class="error-message">
                        Getränkekarte konnte nicht geladen werden. Bitte prüfen Sie, ob "menu.json" im übergeordneten Ordner liegt.
                    </div>
                `;
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadMenu();
            loadQrCode().catch(error => console.error('Failed to load qrcode.svg:', error));
        });
    </script>
</body>
</html>
