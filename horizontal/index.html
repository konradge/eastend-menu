<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eastend - Drink Menu (Landscape)</title>
    <style>
        /* ── TV theme (screenshot / projection) ──────────────────────────
           Change these values to retheme; everything below references them.
             --bg     page & card background
             --fg     primary text  (titles, item names, prices)
             --muted  secondary text (subtitle, subs, footer, QR label)
             --line   rules & borders
             --dot    dotted price leader lines                        */
        :root {
            --bg: #3a3a3a;
            --fg: #f2f2f2;
            --muted: #c8c8c8;
            --line: #d8d8d8;
            --dot: #9a9a9a;
        }

        /* Base styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Printable Card Sheet: A4 landscape ratio */
        .card {
            background-color: var(--bg);
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 297 / 210;
            border: 2px solid var(--line);
            padding: 24px 44px;
            margin: auto;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--line);
        }

        h1 {
            font-size: 44px;
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
            color: var(--muted);
        }

        /* Menu Content: single row of the four sections */
        #menu-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            align-content: center;
            column-gap: 48px;
            padding: 18px 0;
        }

        .menu-section {
            padding-bottom: 14px;
        }

        h2 {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .item-row:last-child {
            margin-bottom: 0;
        }

        .item-dots {
            flex: 1;
            border-bottom: 2px dotted var(--dot);
            margin: 0 10px;
            transform: translateY(-4px);
        }

        .item-details {
            display: flex;
            flex-direction: column;
        }

        .item-name {
            font-size: 15px;
            font-weight: 600;
        }

        .item-sub {
            font-size: 12px;
            font-weight: 400;
            margin-top: 2px;
            color: var(--muted);
        }

        /* Prices: Thin & Cursive */
        .item-price {
            font-size: 15px;
            font-weight: 300;
            font-style: italic;
            white-space: nowrap;
            margin-left: 16px;
        }

        .section-desc {
            font-size: 12px;
            margin-bottom: 10px;
            color: var(--muted);
        }

        /* Footer & QR Code Area: bold rule at the very bottom */
        footer {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 2px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        /* Footer Text: Thin & Cursive */
        .footer-text {
            font-size: 13px;
            font-weight: 300;
            font-style: italic;
            line-height: 1.5;
            color: var(--muted);
        }

        /* QR code is only shown in the screenshot (?shot) version */
        .qr-box {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-shrink: 0;
        }

        body.shot .qr-box {
            display: flex;
        }

        .qr-code {
            width: 92px;
            height: 92px;
        }

        .qr-label {
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
            max-width: 130px;
            line-height: 1.4;
            color: var(--muted);
        }

        /* Error state formatting */
        .error-message {
            font-size: 14px;
            padding: 20px 0;
            text-align: center;
            font-style: italic;
        }

        /* Full-bleed mode for automated screenshots (?shot): no grey
           background, no border, card fills the entire viewport */
        body.shot {
            padding: 0;
            background: var(--bg);
            display: block;
        }

        body.shot .card {
            width: 100%;
            max-width: none;
            min-height: 100vh;
            aspect-ratio: auto;
            border: none;
            margin: 0;
        }

        /* Print Optimization: exact A4 landscape */
        @media print {
            @page {
                size: A4 landscape;
                margin: 10mm;
            }

            body {
                padding: 0;
                background: var(--bg);
            }

            .card {
                max-width: none;
                width: auto;
                aspect-ratio: auto;
                border: 2px solid var(--line);
                padding: 24px 36px;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- HEADER -->
        <header>
            <div>
                <h1>eastend</h1>
                <div class="subtitle">DRINK MENU</div>
            </div>
            <img class="wolf" src="../assets/wolf-web.png" alt="Wolf" style="height: 96px; width: auto;">
        </header>

        <!-- DYNAMIC MENU SECTIONS (Populated via fetch from ../menu.json) -->
        <main id="menu-container"></main>

        <!-- FOOTER & QR CODE -->
        <footer>
            <div class="footer-text">
                Cash only &middot; Please bring back bottles and glasses &middot; No more drinks after 0:45
            </div>

            <div class="qr-box">
                <svg class="qr-code" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 37 37" role="img" aria-label="QR-Code: https://konradge.github.io/eastend-menu/"></svg>
                <span class="qr-label">Complete drink menu with all details and specials</span>
            </div>
        </footer>
    </div>

    <!-- FETCHING DATA FROM menu.json (one level up from /horizontal/) -->
    <script>
        // ?shot => full-bleed layout for automated screenshots
        if (location.search.includes('shot')) {
            document.body.classList.add('shot');
            // report the card's height for the screenshot script
            new ResizeObserver(() => {
                document.title = 'SHOTHEIGHT=' +
                    Math.ceil(document.querySelector('.card').getBoundingClientRect().height);
            }).observe(document.querySelector('.card'));
        }

        // Render menu content dynamically into DOM
        function renderMenu(data) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            data.forEach(section => {
                const sectionEl = document.createElement('section');
                sectionEl.className = 'menu-section';

                let sectionHTML = `<h2>${section.category}</h2>`;

                if (section.description) {
                    sectionHTML += `<div class="section-desc">${section.description}</div>`;
                }

                section.items.forEach(item => {
                    sectionHTML += `
                        <div class="item-row">
                            <div class="item-details">
                                <span class="item-name">${item.name}</span>
                                ${item.sub ? `<span class="item-sub">${item.sub}</span>` : ''}
                            </div>
                            <span class="item-dots"></span>
                            <span class="item-price">${item.price}</span>
                        </div>
                    `;
                });

                sectionEl.innerHTML = sectionHTML;
                container.appendChild(sectionEl);
            });
        }

        // Fill the QR code SVG from the shared asset
        async function loadQrCode() {
            const svg = document.querySelector('.qr-code');
            const response = await fetch('../qrcode.svg');
            const text = await response.text();
            const inner = text.match(/<svg[^>]*>([\s\S]*)<\/svg>/)[1];
            svg.innerHTML = inner;
        }

        // Fetch menu.json asynchronously
        async function loadMenu() {
            try {
                const response = await fetch('../menu.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                renderMenu(data);
            } catch (error) {
                console.error('Failed to load menu.json:', error);
                document.getElementById('menu-container').innerHTML = `
                    <div class="error-message">
                        Could not load the drink menu. Please check that "menu.json" is in the parent folder.
                    </div>
                `;
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadMenu();
            loadQrCode().catch(error => console.error('Failed to load qrcode.svg:', error));
        });
    </script>
</body>
</html>
